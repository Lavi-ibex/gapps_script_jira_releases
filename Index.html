<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ibex Jira Releases</title>
  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --bg-card-hover: #ffffff;
      --bg-desc: #f1f5f9;
      --border-color: #e2e8f0;
      --border-hover: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary-accent: #0284c7;
      --logo-text-color: #0f172a;
      
      --btn-bg: #ffffff;
      --btn-hover: #f1f5f9;
      --btn-border: #cbd5e1;
      
      --badge-released-bg: #dcfce7;
      --badge-released-text: #15803d;
      --badge-unreleased-bg: #e0f2fe;
      --badge-unreleased-text: #0369a1;
      --badge-overdue-bg: #fee2e2;
      --badge-overdue-text: #b91c1c;
      --badge-archived-bg: #f1f5f9;
      --badge-archived-text: #64748b;

      --date-badge-bg: #f8fafc;
      --date-badge-border: #cbd5e1;
      --date-badge-text: #0f172a;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    [data-theme="dark"], body.theme-dark {
      --bg-primary: #0b1120;
      --bg-card: #1e293b;
      --bg-card-hover: #24344d;
      --bg-desc: #0f172a;
      --border-color: #334155;
      --border-hover: #475569;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary-accent: #38bdf8;
      --logo-text-color: #ffffff;
      
      --btn-bg: #1e293b;
      --btn-hover: #334155;
      --btn-border: #475569;
      
      --badge-released-bg: #064e3b;
      --badge-released-text: #6ee7b7;
      --badge-unreleased-bg: #0c4a6e;
      --badge-unreleased-text: #7dd3fc;
      --badge-overdue-bg: #7f1d1d;
      --badge-overdue-text: #fca5a5;
      --badge-archived-bg: #334155;
      --badge-archived-text: #cbd5e1;

      --date-badge-bg: #0f172a;
      --date-badge-border: #334155;
      --date-badge-text: #f8fafc;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      padding: 24px;
      line-height: 1.5;
      font-size: 1.06rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      padding-top: 56px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      position: relative;
    }

    .header-brand {
      display: contents;
    }

    .ibex-logo {
      position: absolute;
      top: 0;
      left: 50%;
      width: 129px;
      height: auto;
      transform: translateX(-50%);
    }

    .header-title h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .header-title p {
      font-size: 0.98rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn-action {
      background-color: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--text-main);
      padding: 9px 16px;
      font-size: 0.94rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
    }

    .btn-action:hover {
      background-color: var(--btn-hover);
      border-color: var(--border-hover);
    }

    .btn-action:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .icon-svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Summary KPI Bar */
    .summary-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .summary-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px 20px;
      box-shadow: var(--shadow-sm);
    }

    .summary-card .label {
      font-size: 0.82rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .summary-card .value {
      font-size: 1.7rem;
      font-weight: 700;
      margin-top: 4px;
      color: var(--text-main);
    }

    /* Release Cards Table */
    .releases-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .release-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 22px 26px;
      box-shadow: var(--shadow-sm);
    }

    .release-card:hover {
      background: var(--bg-card-hover);
      box-shadow: var(--shadow-md);
      border-color: var(--border-hover);
    }

    .release-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .release-name {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .release-link {
      color: var(--text-main);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s ease;
    }

    .release-link:hover {
      color: var(--primary-accent);
      text-decoration: underline;
    }

    .link-icon {
      width: 15px;
      height: 15px;
      opacity: 0.6;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .release-link:hover .link-icon {
      opacity: 1;
      transform: translate(1px, -1px);
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }

    .badge-released {
      background-color: var(--badge-released-bg);
      color: var(--badge-released-text);
    }

    .badge-unreleased {
      background-color: var(--badge-unreleased-bg);
      color: var(--badge-unreleased-text);
    }

    .badge-overdue {
      background-color: var(--badge-overdue-bg);
      color: var(--badge-overdue-text);
    }

    .badge-archived {
      background-color: var(--badge-archived-bg);
      color: var(--badge-archived-text);
    }

    /* Distinctive Release Date Badge */
    .release-date-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--date-badge-bg);
      border: 1px solid var(--date-badge-border);
      color: var(--date-badge-text);
      padding: 7px 15px;
      border-radius: 6px;
      font-size: 0.94rem;
      margin-bottom: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }

    .date-icon {
      width: 15px;
      height: 15px;
      color: var(--primary-accent);
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .date-label {
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .date-val {
      font-weight: 700;
      color: var(--text-main);
    }

    .date-edit {
      padding: 2px 4px;
      border: 0;
      background: transparent;
      color: var(--primary-accent);
      font: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
    }

    .date-edit:hover {
      text-decoration: underline;
    }

    .date-edit:focus-visible {
      outline: 2px solid var(--primary-accent);
      outline-offset: 2px;
    }

    .date-editor {
      max-width: 330px;
      margin: -2px 0 14px;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-desc);
    }

    .date-editor[hidden] {
      display: none;
    }

    .date-editor label {
      display: block;
      margin-bottom: 6px;
      color: var(--text-main);
      font-size: 0.94rem;
      font-weight: 700;
    }

    .date-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--btn-border);
      border-radius: 5px;
      background: var(--bg-card);
      color: var(--text-main);
      font: inherit;
    }

    .date-input:focus {
      outline: 2px solid var(--primary-accent);
      outline-offset: 2px;
    }

    .release-description {
      font-size: 1rem;
      color: var(--text-main);
      background: var(--bg-desc);
      padding: 12px 16px;
      border-radius: 6px;
      border-left: 3px solid var(--primary-accent);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .release-description[hidden] {
      display: none;
    }

    .release-description-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .description-heading {
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .description-edit {
      padding: 2px 4px;
      border: 0;
      background: transparent;
      color: var(--primary-accent);
      font: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
    }

    .description-edit:hover {
      text-decoration: underline;
    }

    .description-edit:focus-visible {
      outline: 2px solid var(--primary-accent);
      outline-offset: 2px;
    }

    .description-toggle {
      margin-top: 12px;
      padding: 7px 12px;
      border: 1px solid var(--btn-border);
      border-radius: 5px;
      background: var(--btn-bg);
      color: var(--text-main);
      font: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
    }

    .description-toggle:hover {
      background: var(--btn-hover);
    }

    .description-toggle:focus-visible {
      outline: 2px solid var(--primary-accent);
      outline-offset: 2px;
    }

    .date-editor-actions,
    .description-actions,
    .description-editor-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .description-editor {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-desc);
    }

    .description-editor[hidden] {
      display: none;
    }

    .description-input {
      width: 100%;
      min-height: 140px;
      padding: 10px;
      border: 1px solid var(--btn-border);
      border-radius: 5px;
      background: var(--bg-card);
      color: var(--text-main);
      font: inherit;
      line-height: 1.5;
      resize: vertical;
    }

    .description-input:focus {
      outline: 2px solid var(--primary-accent);
      outline-offset: 2px;
    }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
      background: var(--bg-card);
      border-radius: 8px;
      border: 1px dashed var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .alert-error {
      background-color: #fee2e2;
      border: 1px solid #f87171;
      color: #991b1b;
      padding: 14px 18px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    [data-theme="dark"] .alert-error {
      background-color: #450a0a;
      border-color: #991b1b;
      color: #fca5a5;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(125, 125, 125, 0.3);
      border-radius: 50%;
      border-top-color: currentColor;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 760px) {
      body {
        padding: 16px;
      }

      .header {
        align-items: flex-start;
        padding-top: 52px;
      }

      .header-actions {
        width: 100%;
        justify-content: flex-start;
      }

      .release-header,
      .release-date-badge {
        flex-wrap: wrap;
      }

      .release-card {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-title">
        <div class="header-brand" style="display: flex; align-items: center; gap: 14px;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 585.7 286.6" class="ibex-logo-svg" style="height: 32px; width: auto; vertical-align: middle;">
            <defs>
              <linearGradient id="ibex-orange-gradient-rel" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#FF0786"/>
                <stop offset="35.7%" stop-color="#FF2D00"/>
                <stop offset="100%" stop-color="#FF9C09"/>
              </linearGradient>
            </defs>
            <g class="ibex-logo-body" fill="var(--logo-text-color, #0F172A)">
              <path d="M73.8,93.4c0-7.1-5.8-12.9-12.9-12.9s-12.9,5.8-12.9,12.9l0,124.2c0,7.1,5.8,12.9,12.9,12.9s12.9-5.8,12.9-12.9L73.8,93.4z M171.5,230.4c32.1,0,48.3-17.8,48.3-45c0-17.4-6.5-29.4-23.2-35.8c9.1-4.5,16.5-15.6,16.5-30.3c0-20.5-12-38.7-45.6-38.7h-59.2c-7.1,0-12.9,5.8-12.9,12.9l0,124c0,7.1,5.8,12.9,12.9,12.9H171.5z M121.2,163.6h50.3c14.7,0,22,8.2,22,21.8c0,13.4-6.2,21.8-22,21.8h-50.3L121.2,163.6z M121.2,103.7h46.3c14,0,19.8,7.3,19.8,18.9c0,11.1-5.8,19.1-19.8,19.1h-46.3L121.2,103.7z M262.4,103.7h71.4c6.5,0,11.6-5.1,11.6-11.6c0-6.5-5.1-11.6-11.6-11.6h-84.3c-7.1,0-12.9,5.8-12.9,12.9l0,124c0,7.1,5.8,12.9,12.9,12.9h86.8c6.5,0,11.6-5.1,11.6-11.6c0-6.5-5.1-11.6-11.6-11.6h-73.9v-41h57c6.2,0,11.4-5.1,11.4-11.4s-5.1-11.4-11.4-11.4h-57L262.4,103.7z"/>
              <path d="M409.2,139.2c-3.3,0-6.5-1.2-9-3.7L366,101.2c-5-5-5-13.1,0-18.1c5-5,13.1-5,18.1,0l34.2,34.2c5,5,5,13.1,0,18.1C415.8,137.9,412.5,139.2,409.2,139.2z"/>
              <path d="M375,231.6c-3.3,0-6.5-1.2-9-3.7c-5-5-5-13.1,0-18.1l34.2-34.2c5-5,13.1-5,18.1,0c5,5,5,13.1,0,18.1l-34.2,34.2C381.6,230.4,378.3,231.6,375,231.6z"/>
              <path d="M501.6,231.6c-3.3,0-6.5-1.2-9-3.7l-34.2-34.2c-5-5-5-13.1,0-18.1c5-5,13.1-5,18.1,0l34.2,34.2c5,5,5,13.1,0,18.1C508.2,230.4,504.9,231.6,501.6,231.6z"/>
              <path d="M438.3,172.7c9.5,0,17.3-7.7,17.3-17.3s-7.7-17.3-17.3-17.3s-17.3,7.7-17.3,17.3S428.8,172.7,438.3,172.7"/>
            </g>
            <path fill="url(#ibex-orange-gradient-rel)" d="M467.5,139.2c-3.3,0-6.5-1.2-9-3.7c-5-5-5-13.1,0-18.1L528.8,47c5-5,13.1-5,18.1,0c5,5,5,13.1,0,18.1l-70.3,70.3C474,137.9,470.7,139.2,467.5,139.2z"/>
          </svg>
          <h1>Ibex Jira Releases</h1>
        </div>
        <p id="sub-header">Live releases tracked from Jira Cloud - powered by Google Apps Script</p>
      </div>
      <div class="header-actions">
        <button id="btn-toggle-all-descriptions" class="btn-action" type="button" aria-pressed="false" onclick="toggleAllDescriptions()">
          Show all descriptions
        </button>

        <!-- Theme Toggle Button -->
        <button id="btn-theme" class="btn-action" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
          <span id="theme-icon">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </span>
          <span id="theme-label">Dark Mode</span>
        </button>

        <!-- Refresh Button -->
        <button id="btn-refresh" class="btn-action" onclick="fetchReleases(true)">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
          Refresh
        </button>
      </div>
    </div>

    <!-- Error Banner -->
    <div id="error-container" style="display: none;"></div>

    <!-- Summary KPIs -->
    <div class="summary-bar">
      <div class="summary-card">
        <div class="label">Upcoming / Active</div>
        <div class="value" id="kpi-unreleased">-</div>
      </div>
      <div class="summary-card">
        <div class="label">Released in 2026</div>
        <div class="value" id="kpi-released">-</div>
      </div>
    </div>

    <!-- Releases Card List -->
    <div id="releases-container" class="releases-list">
      <div class="empty-state">
        <span class="spinner"></span>
        <span>Loading releases from Jira...</span>
      </div>
    </div>
  </div>

  <script>
    var currentReleases = [];

    // --- Theme Management ---
    function initTheme() {
      var savedTheme = localStorage.getItem('ibex_theme') || localStorage.getItem('ibex_jira_theme');
      if (!savedTheme) {
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          savedTheme = 'dark';
        } else {
          savedTheme = 'light';
        }
      }
      applyTheme(savedTheme);
    }

    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme') || 'light';
      var next = current === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      localStorage.setItem('ibex_theme', next);
      localStorage.setItem('ibex_jira_theme', next);
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      if (theme === 'dark') {
        document.body.classList.add('theme-dark');
      } else {
        document.body.classList.remove('theme-dark');
      }
      var iconContainer = document.getElementById('theme-icon');
      var label = document.getElementById('theme-label');

      if (theme === 'dark') {
        iconContainer.innerHTML = '☀️';
        label.textContent = 'Light Mode';
      } else {
        iconContainer.innerHTML = '🌙';
        label.textContent = 'Dark Mode';
      }
    }

    // --- Data Fetching ---
    function fetchReleases(forceRefresh) {
      var btn = document.getElementById('btn-refresh');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Refreshing...';
      hideError();

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(releases) {
            btn.disabled = false;
            btn.innerHTML = '<svg class="icon-svg" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg> Refresh';
            currentReleases = releases || [];
            renderReleases(currentReleases);
          })
          .withFailureHandler(function(err) {
            btn.disabled = false;
            btn.innerHTML = '<svg class="icon-svg" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg> Refresh';
            showError(err.message || err);
          })
          .apiGetReleases(forceRefresh);
      } else {
        // Fallback for local preview testing
        setTimeout(function() {
          btn.disabled = false;
          btn.innerHTML = '<svg class="icon-svg" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg> Refresh';
        }, 800);
      }
    }

    function renderReleases(releases) {
      var container = document.getElementById('releases-container');
      
      var countUnreleased = 0;
      var countReleased = 0;

      if (!releases || releases.length === 0) {
        container.innerHTML = '<div class="empty-state">No releases found for this Jira project.</div>';
        document.getElementById('kpi-unreleased').textContent = '0';
        document.getElementById('kpi-released').textContent = '0';
        updateGlobalDescriptionToggle();
        return;
      }

      var html = '';
      releases.forEach(function(r, index) {
        if (r.released) countReleased++;
        else countUnreleased++;

        var badgeClass = 'badge-unreleased';
        var dateLabel = 'Target Release';
        if (r.statusCategory === 'released') {
          badgeClass = 'badge-released';
          dateLabel = 'Released on';
        } else if (r.statusCategory === 'overdue') {
          badgeClass = 'badge-overdue';
          dateLabel = 'Target Release (Overdue)';
        } else if (r.statusCategory === 'archived') {
          badgeClass = 'badge-archived';
          dateLabel = 'Archived Release';
        }

        // Construct release name with external Jira link
        var releaseNameHtml = '';
        var safeName = escapeHtml(r.name);
        if (r.url) {
          releaseNameHtml = '<a href="' + escapeHtml(r.url) + '" target="_blank" rel="noopener noreferrer" class="release-link" title="Open in Jira">' +
            safeName +
            '<svg class="link-icon" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>' +
            '</a>';
        } else {
          releaseNameHtml = safeName;
        }

        html += '<div class="release-card">';
        html += '  <div class="release-header">';
        html += '    <div class="release-name">' + releaseNameHtml + '</div>';
        html += '    <span class="badge ' + badgeClass + '">' + escapeHtml(r.status) + '</span>';
        html += '  </div>';
        
        // Distinctive Date Badge
        var dateEditorId = 'release-date-editor-' + index;
        var dateInputId = 'release-date-input-' + index;
        html += '  <div class="release-date-badge">';
        html += '    <svg class="date-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>';
        html += '    <span class="date-label">' + escapeHtml(dateLabel) + ':</span>';
        html += '    <span class="date-val">' + escapeHtml(r.userReleaseDate || 'No date set') + '</span>';
        html += '    <button type="button" class="date-edit" aria-expanded="false" aria-controls="' + dateEditorId + '" onclick="showDateEditor(this)">Edit</button>';
        html += '  </div>';
        html += '  <div id="' + dateEditorId + '" class="date-editor" hidden>';
        html += '    <label for="' + dateInputId + '">Release date</label>';
        html += '    <input id="' + dateInputId + '" class="date-input" type="date" required value="' + escapeHtml(r.releaseDate || '') + '">';
        html += '    <div class="date-editor-actions">';
        html += '      <button type="button" class="btn-action" data-version-id="' + escapeHtml(r.id || '') + '" data-input-id="' + dateInputId + '" data-editor-id="' + dateEditorId + '" onclick="saveReleaseDate(this)">Save date</button>';
        html += '      <button type="button" class="btn-action" data-input-id="' + dateInputId + '" data-editor-id="' + dateEditorId + '" onclick="cancelDateEdit(this)">Cancel</button>';
        html += '    </div>';
        html += '  </div>';

        if (r.description && r.description !== 'No description provided.') {
          var descriptionId = 'release-description-' + index;
          var editorId = 'release-description-editor-' + index;
          var inputId = 'release-description-input-' + index;
          html += '  <div class="description-actions">';
          html += '    <button type="button" class="description-toggle" aria-expanded="false" aria-controls="' + descriptionId + '" data-editor-id="' + editorId + '" onclick="toggleDescription(this)">Show description</button>';
          html += '  </div>';
          html += '  <div id="' + descriptionId + '" class="release-description" hidden>';
          html += '    <div class="release-description-header">';
          html += '      <span class="description-heading">Description</span>';
          html += '      <button type="button" class="description-edit" aria-expanded="false" aria-controls="' + editorId + '" onclick="showDescriptionEditor(this)">Edit</button>';
          html += '    </div>';
          html += '    <div class="release-description-content">' + escapeHtml(r.description) + '</div>';
          html += '    <div id="' + editorId + '" class="description-editor" hidden>';
          html += '      <label for="' + inputId + '">Release description</label>';
          html += '      <textarea id="' + inputId + '" class="description-input" maxlength="32767">' + escapeHtml(r.description) + '</textarea>';
          html += '      <div class="description-editor-actions">';
          html += '        <button type="button" class="btn-action" data-version-id="' + escapeHtml(r.id || '') + '" data-input-id="' + inputId + '" data-editor-id="' + editorId + '" onclick="saveDescription(this)">Save description</button>';
          html += '        <button type="button" class="btn-action" data-input-id="' + inputId + '" data-editor-id="' + editorId + '" onclick="cancelDescriptionEdit(this)">Cancel</button>';
          html += '      </div>';
          html += '    </div>';
          html += '    </div>';
          html += '  </div>';
        }

        html += '</div>';
      });

      container.innerHTML = html;
      document.getElementById('kpi-unreleased').textContent = countUnreleased;
      document.getElementById('kpi-released').textContent = countReleased;
      updateGlobalDescriptionToggle();
    }

    function toggleDescription(button) {
      var expanded = button.getAttribute('aria-expanded') === 'true';
      setDescriptionExpanded(button, !expanded);
      updateGlobalDescriptionToggle();
    }

    function setDescriptionExpanded(button, expanded) {
      var description = document.getElementById(button.getAttribute('aria-controls'));
      if (!description) return;
      button.setAttribute('aria-expanded', expanded ? 'true' : 'false');
      button.textContent = expanded ? 'Hide description' : 'Show description';
      description.hidden = !expanded;
      if (!expanded) {
        var editor = document.getElementById(button.getAttribute('data-editor-id'));
        if (editor) editor.hidden = true;
      }
    }

    function toggleAllDescriptions() {
      var buttons = document.querySelectorAll('.description-toggle');
      var shouldExpand = Array.prototype.some.call(buttons, function(button) {
        return button.getAttribute('aria-expanded') !== 'true';
      });

      Array.prototype.forEach.call(buttons, function(button) {
        setDescriptionExpanded(button, shouldExpand);
      });
      updateGlobalDescriptionToggle();
    }

    function updateGlobalDescriptionToggle() {
      var globalButton = document.getElementById('btn-toggle-all-descriptions');
      var buttons = document.querySelectorAll('.description-toggle');
      var allExpanded = buttons.length > 0 && Array.prototype.every.call(buttons, function(button) {
        return button.getAttribute('aria-expanded') === 'true';
      });

      globalButton.disabled = buttons.length === 0;
      globalButton.setAttribute('aria-pressed', allExpanded ? 'true' : 'false');
      globalButton.textContent = allExpanded ? 'Hide all descriptions' : 'Show all descriptions';
    }

    function showDateEditor(button) {
      var editor = document.getElementById(button.getAttribute('aria-controls'));
      if (!editor) return;
      editor.hidden = false;
      button.setAttribute('aria-expanded', 'true');
      editor.querySelector('input[type="date"]').focus();
    }

    function cancelDateEdit(button) {
      var editor = document.getElementById(button.getAttribute('data-editor-id'));
      var input = document.getElementById(button.getAttribute('data-input-id'));
      if (!editor || !input) return;
      input.value = input.defaultValue;
      editor.hidden = true;
      var editButton = document.querySelector('[aria-controls="' + editor.id + '"]');
      if (editButton) editButton.setAttribute('aria-expanded', 'false');
    }

    function saveReleaseDate(button) {
      var versionId = button.getAttribute('data-version-id');
      var input = document.getElementById(button.getAttribute('data-input-id'));
      var editor = document.getElementById(button.getAttribute('data-editor-id'));
      if (!versionId || !input || !editor) {
        showError('The release date editor is unavailable.');
        return;
      }

      if (!input.value) {
        showError('Select a release date before saving.');
        input.focus();
        return;
      }

      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        showError('Saving release dates is available only in the deployed dashboard.');
        return;
      }

      button.disabled = true;
      button.textContent = 'Saving...';
      hideError();
      google.script.run
        .withSuccessHandler(function() {
          editor.hidden = true;
          button.disabled = false;
          button.textContent = 'Save date';
          fetchReleases(true);
        })
        .withFailureHandler(function(err) {
          button.disabled = false;
          button.textContent = 'Save date';
          showError(err && err.message ? err.message : 'Could not save the release date.');
        })
        .apiUpdateReleaseDate(versionId, input.value);
    }

    function showDescriptionEditor(button) {
      var editor = document.getElementById(button.getAttribute('aria-controls'));
      if (!editor) return;
      editor.hidden = false;
      button.setAttribute('aria-expanded', 'true');
      editor.querySelector('textarea').focus();
    }

    function cancelDescriptionEdit(button) {
      var editor = document.getElementById(button.getAttribute('data-editor-id'));
      var input = document.getElementById(button.getAttribute('data-input-id'));
      if (!editor || !input) return;
      input.value = input.defaultValue;
      editor.hidden = true;
      var editButton = document.querySelector('[aria-controls="' + editor.id + '"]');
      if (editButton) editButton.setAttribute('aria-expanded', 'false');
    }

    function saveDescription(button) {
      var versionId = button.getAttribute('data-version-id');
      var input = document.getElementById(button.getAttribute('data-input-id'));
      var editor = document.getElementById(button.getAttribute('data-editor-id'));
      if (!versionId || !input || !editor) {
        showError('The release description editor is unavailable.');
        return;
      }

      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        showError('Saving descriptions is available only in the deployed dashboard.');
        return;
      }

      button.disabled = true;
      button.textContent = 'Saving...';
      hideError();
      google.script.run
        .withSuccessHandler(function() {
          editor.hidden = true;
          button.disabled = false;
          button.textContent = 'Save description';
          fetchReleases(true);
        })
        .withFailureHandler(function(err) {
          button.disabled = false;
          button.textContent = 'Save description';
          showError(err && err.message ? err.message : 'Could not save the release description.');
        })
        .apiUpdateReleaseDescription(versionId, input.value);
    }

    function showError(msg) {
      var container = document.getElementById('error-container');
      container.className = 'alert-error';
      container.textContent = 'Error: ' + msg;
      container.style.display = 'block';
    }

    function hideError() {
      var container = document.getElementById('error-container');
      container.style.display = 'none';
      container.textContent = '';
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.onload = function() {
      initTheme();
      fetchReleases(false);
    };
  </script>
</body>
</html>
